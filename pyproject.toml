[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-analysis"
version = "0.1.0"
description = "Thermogravimetric (TGA) signal denoising and mass-loss event quantification."
authors = [{ name = "Jeffrey W. Bullard" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[project.scripts]
tga-analyze = "tga_analysis.run:main"

[tool.setuptools]
packages = ["tga_analysis"]
